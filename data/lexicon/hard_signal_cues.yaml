# Hard-signal request-cue lexicon (Phase 1 seed).
#
# One list per hard-signal tactic. Each phrase is a *request/ask* that a legitimate
# bank / gov / telecom / delivery call never makes (OTP, card credentials, transfer to a
# "safe account", installing remote-access software, demanding secrecy). Seeded from
# data/taxonomy/tactics.yaml examples_ru/kk for these tactics; Phase 2 expands it via
# scripts/expand_cue_lexicon.py (Gemini, build-time only).
#
# INVARIANT: never add a bare-mention cue (e.g. plain "код" / "карта"). Legitimate calls
# mention codes/cards precisely to say they are NOT needed ("код называть не нужно",
# "никаких кодов не нужно") -- those calls must produce an all-zero cue block.
version: 1
cues:
  secrecy:
    - "do not tell anyone"  # EN (ADR D54)
    - "don't tell anyone"
    - "do not discuss this with anyone"
    - "Никому не говорите"
    - "это секретная операция"
    - "Не сообщайте сотрудникам банка"
    - "Ешкімге айтпаңыз"
    - "бұл құпия операция"
    - "Банк қызметкерлеріне айтпаңыз"
    - "ешкімге айтпа"  # bare-imperative ASR form (no -ңыз suffix)
  otp_request:
    - "tell me the code"  # EN (ADR D54); NOT bare "the code" -- see the invariant above
    - "the six-digit code"
    - "Продиктуйте код из SMS"
    - "код из SMS"
    - "код из push"
    - "код из сообщения"  # ASR-normalized form ("сообщение" instead of "SMS/push")
    - "Назовите шесть цифр"
    - "шесть цифр из push"
    - "код из СМС"  # Cyrillic acronym: what RU speakers write and Vosk actually decodes (ADR D51)
    - "SMS-тегі кодты айтыңыз"
    - "SMS тегі кодты айтыңыз"  # ASR form: the recogniser drops the suffix hyphen (PLAN A10)
    - "СМС-тегі кодты айтыңыз"  # Cyrillic acronym, KK (same bug class; no corpus row exercises it yet)
    - "СМС тегі кодты айтыңыз"  # Cyrillic acronym, KK, ASR form (no suffix hyphen)
    - "алты санды атаңыз"
  credentials_request:
    - "your card number and the CVV"  # EN (ADR D54)
    - "your full card number"
    - "Назовите номер карты"
    - "номер карты и три цифры"
    - "три цифры на обороте"
    - "Продиктуйте ваш ИИН"
    - "Карта нөмірі мен арт жағындағы"
    - "ЖСН-іңізді айтыңыз"
    - "ЖСН іңізді айтыңыз"  # ASR form: no suffix hyphen (PLAN A10)
  safe_account:
    - "safe account"  # EN (ADR D54)
    - "secure account"
    - "на безопасный счёт"
    - "безопасный счёт"
    - "безопасной счёт"  # ASR-normalized inflection (e.g. genitive-ish reading)
    - "безопасному счёту"  # ASR-normalized dative inflection
    - "безопасный счет"  # е-vs-ё spelling variant
    - "резервный счёт Нацбанка"
    - "қауіпсіз шотқа аударыңыз"
    - "қауіпсіз шотқа аудар"  # bare-imperative ASR form (no -ыңыз suffix)
    - "резервтік шоты"
  remote_access:
    - "Установите приложение"
    - "AnyDesk"
    - "TeamViewer"  # named in the comment below and used 35x across ru/kk/mixed/en, never a cue (ADR D54)
    - "Скачайте программу для защиты"
    - "қосымшасын орнатыңыз"
    - "бағдарламасын жүктеңіз"
    # Behaviour, not brand: the recogniser renders AnyDesk / TeamViewer as «аны десіп»,
    # «не доски», «сиам жібер» -- unmatchable across alphabets, so cue the action (ADR D39).
    - "қашықтан кіру"
    - "қашықтан қосыл"
    - "бағдарламасын орнат"
